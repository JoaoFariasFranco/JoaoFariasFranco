name: Update Contributions

on:
  schedule:
    - cron: '0 1 * * *'          # diariamente à 01:00 UTC
  workflow_dispatch:               # permite execução manual

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write              # necessário para fazer push

    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Validate GitHub token
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if [ -n "$GH_PAT" ]; then
            echo "Using GH_PAT from repository secrets."
          elif [ -n "$GITHUB_TOKEN" ]; then
            echo "GH_PAT not configured; falling back to github.token."
          else
            echo "No GitHub token available for the API request." >&2
            exit 1
          fi

      - name: Run fetch_contributions
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT || github.token }}
          GH_PAT: ${{ secrets.GH_PAT || github.token }}        # token com read:user; usa o PAT se existir, senão o token do workflow
          GH_PROFILE_USER: JoaoFariasFranco
        run: python scripts/fetch_contributions.py

      - name: Render contribution graph
        run: |
          test -f data/contributions.json || { echo "Expected data/contributions.json was not generated." >&2; exit 1; }
          python -m builder --graph

      - name: Commit and push if changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/contributions.json assets/graph-*.svg
          git diff --staged --quiet || (git commit -m "📊 Atualiza contribuições e heatmap [skip ci]" && git push)