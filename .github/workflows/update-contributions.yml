name: Update Contributions

on:
  schedule:
    - cron: '0 1 * * *'          # diariamente à 01:00 UTC
  workflow_dispatch:               # permite execução manual

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write              # necessário para fazer push

    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run fetch_contributions
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT || github.token }}
          GH_PAT: ${{ secrets.GH_PAT || github.token }}        # token com read:user; usa o PAT se existir, senão o token do workflow
          GH_PROFILE_USER: JoaoFariasFranco
        run: python scripts/fetch_contributions.py

      - name: Commit and push if changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/contributions.json
          git diff --staged --quiet || (git commit -m "📊 Atualiza contribuições diárias [skip ci]" && git push)