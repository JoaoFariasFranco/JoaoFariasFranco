<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 520">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="100%">
      <stop offset="0%" stop-color="#0969da" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="1" />
    </radialGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8250df">
        <animate attributeName="stop-color" values="#8250df;#0969da;#1a7f3f;#8250df" dur="10s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#0969da">
        <animate attributeName="stop-color" values="#0969da;#1a7f3f;#8250df;#0969da" dur="10s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#1a7f3f">
        <animate attributeName="stop-color" values="#1a7f3f;#8250df;#0969da;#1a7f3f" dur="10s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <linearGradient id="scanlineLaser" x1="100%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0969da" stop-opacity="0" />
      <stop offset="30%" stop-color="#0969da" stop-opacity="0.25" />
      <stop offset="70%" stop-color="#8250df" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#8250df" stop-opacity="0" />
    </linearGradient>

    <filter id="noiseFilter">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" stitchTiles="stitch" />
      <feColorMatrix type="saturate" values="0" />
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.015" />
      </feComponentTransfer>
    </filter>

    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>


    <clipPath id="clip-ascii-reveal">
      <rect x="0" y="0" width="400" height="0">
        <animate attributeName="height" from="0" to="430" dur="2s" begin="0.2s" fill="freeze" calcMode="spline" keySplines="0.25 0.1 0.25 1" />
      </rect>
    </clipPath>

    <clipPath id="clip-line1">
      <rect x="0" y="0" width="0" height="50">
        <animate attributeName="width" from="0" to="650" dur="1s" begin="0.8s" fill="freeze" />
      </rect>
    </clipPath>

    <clipPath id="clip-line2">
      <rect x="0" y="44" width="0" height="46">
        <animate attributeName="width" from="0" to="650" dur="1.2s" begin="1.9s" fill="freeze" />
      </rect>
    </clipPath>

    <clipPath id="clip-details">
      <rect x="0" y="90" width="0" height="160">
        <animate attributeName="width" from="0" to="650" dur="1.8s" begin="3.2s" fill="freeze" />
      </rect>
    </clipPath>

    <clipPath id="clip-ascii-container">
      <rect x="0" y="0" width="400" height="430" rx="12"/>
    </clipPath>
  </defs>

  <rect width="1180" height="520" rx="12" fill="#ffffff"/>
  <rect width="1180" height="520" rx="12" fill="url(#bgGlow)"/>
  <rect width="1180" height="520" rx="12" filter="url(#noiseFilter)" />
  <rect x="1.5" y="1.5" width="1177" height="517" rx="11" fill="none" stroke="url(#accentGrad)" stroke-width="1.5" opacity="0.35"/>

  <clipPath id="cardClip"><rect width="1180" height="520" rx="12"/></clipPath>
  <g clip-path="url(#cardClip)">
    <rect x="0" y="0" width="3" height="520" fill="url(#scanlineLaser)" filter="url(#neonGlow)">
      <animate attributeName="x" values="-10;1190;-10" dur="8s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1; 0.4 0 0.2 1" />
    </rect>
  </g>

  <g fill="#0969da" opacity="0.3">
    <circle cx="120" cy="480" r="1.5"><animate attributeName="cy" values="480;120;480" dur="14s" repeatCount="indefinite"/></circle>
    <circle cx="380" cy="180" r="2"><animate attributeName="cy" values="180;460;180" dur="18s" repeatCount="indefinite"/></circle>
    <circle cx="850" cy="420" r="1.5"><animate attributeName="cy" values="420;80;420" dur="12s" repeatCount="indefinite"/></circle>
    <circle cx="1020" cy="220" r="2"><animate attributeName="cy" values="220;440;220" dur="16s" repeatCount="indefinite"/></circle>
  </g>

  <g transform="translate(35, 45)" clip-path="url(#clip-ascii-container)">
    <rect width="400" height="430" rx="12" fill="#f6f8fa" fill-opacity="0.6" stroke="rgba(31,35,40,0.12)" stroke-width="1.2"/>
    <path d="M0,12 Q0,0 12,0 L388,0 Q400,0 400,12 L400,34 L0,34 Z" fill="rgba(31,35,40,0.04)"/>
    <text x="200" y="22" fill="#656c76" font-size="11" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-weight="normal" letter-spacing="0.5px">VISUAL_ART.asc</text>

