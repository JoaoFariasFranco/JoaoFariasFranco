<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 610" width="1180" height="610">
  <defs>
    <radialGradient id="bgGlowLight" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.03" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="1" />
    </radialGradient>
    
    <linearGradient id="accentGradLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB">
        <animate attributeName="stop-color" values="#2563EB;#06B6D4;#10B981;#2563EB" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#06B6D4">
        <animate attributeName="stop-color" values="#06B6D4;#10B981;#2563EB;#06B6D4" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#10B981">
        <animate attributeName="stop-color" values="#10B981;#2563EB;#06B6D4;#10B981" dur="8s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <filter id="glassShadowLight" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="20" flood-color="#0F172A" flood-opacity="0.1"/>
    </filter>
  </defs>

  <style>
    .text-primary-light { font-family: system-ui, -apple-system, sans-serif; fill: #0F172A; }
    .text-muted-light { font-family: system-ui, -apple-system, sans-serif; fill: #475569; }
    .text-code-light { font-family: 'Courier New', monospace; font-weight: bold; }
    
    .cursor-light { animation: blink 1s step-end infinite; }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

    .pill-light { transition: all 0.3s ease; cursor: pointer; }
    .pill-light:hover rect {
      stroke: #06B6D4; stroke-width: 2;
      filter: drop-shadow(0 0 6px rgba(6, 182, 212, 0.3));
    }
    .pill-light:hover text { fill: #06B6D4; }
  </style>

  <rect width="1180" height="610" fill="#FFFFFF" rx="16"/>
  <rect width="1180" height="610" fill="url(#bgGlowLight)" rx="16"/>

  <g transform="translate(60, 200)">
    <animateTransform attributeName="transform" type="translate" values="60,180; 60,195; 60,180" dur="6s" repeatCount="indefinite"/>
    <text class="text-code-light" fill="url(#accentGradLight)" font-size="16" letter-spacing="2">
      <tspan x="0" dy="1.2em">      .--------.      </tspan>
      <tspan x="0" dy="1.2em">     / .------. \     </tspan>
      <tspan x="0" dy="1.2em">    / /        \ \    </tspan>
      <tspan x="0" dy="1.2em">    | |  {/}   | |    </tspan>
      <tspan x="0" dy="1.2em">    | |        | |    </tspan>
      <tspan x="0" dy="1.2em">    \ \        / /    </tspan>
      <tspan x="0" dy="1.2em">     \ '------' /     </tspan>
      <tspan x="0" dy="1.2em">      '--------'      </tspan>
      <tspan x="0" dy="1.2em">       _||__||_       </tspan>
    </text>
  </g>

  <g transform="translate(420, 50)" filter="url(#glassShadowLight)">
    <rect width="700" height="510" rx="16" fill="#F8FAFC" stroke="rgba(15,23,42,0.08)" stroke-width="1.5"/>
    
    <circle cx="30" cy="30" r="6" fill="#FF5F56"/>
    <circle cx="50" cy="30" r="6" fill="#FFBD2E"/>
    <circle cx="70" cy="30" r="6" fill="#27C93F"/>

    <g transform="translate(40, 90)">
      <text class="text-primary-light" font-size="36" font-weight="800">
        Hi, I'm João Franco <tspan class="cursor-light" fill="url(#accentGradLight)">_</tspan>
      </text>
      <text class="text-muted-light" font-size="20" font-weight="500" y="45">
        > Full Stack Developer &amp; Open Source Contributor
      </text>

      <line x1="0" y1="80" x2="620" y2="80" stroke="rgba(15,23,42,0.1)" stroke-width="1"/>

      <text class="text-muted-light" font-size="16" font-weight="400" y="115">
        <tspan x="0" dy="1.5em">📍 Location: Cyber Space</tspan>
        <tspan x="0" dy="1.5em">🎓 Focus: Building scalable web applications</tspan>
        <tspan x="0" dy="1.5em">📧 Contact: joao.franco.biz@gmail.com</tspan>
      </text>

      <text class="text-primary-light" font-size="20" font-weight="700" y="220">
        Tecnologias &amp; Ferramentas
      </text>

      <g transform="translate(0, 240)">
        <g class="pill-light" transform="translate(0, 0)">
          <rect width="100" height="36" rx="18" fill="#FFFFFF" stroke="rgba(15,23,42,0.1)"/>
          <text class="text-primary-light" font-size="14" x="50" y="23" text-anchor="middle">React</text>
        </g>
        <g class="pill-light" transform="translate(115, 0)">
          <rect width="110" height="36" rx="18" fill="#FFFFFF" stroke="rgba(15,23,42,0.1)"/>
          <text class="text-primary-light" font-size="14" x="55" y="23" text-anchor="middle">Node.js</text>
        </g>
        <g class="pill-light" transform="translate(240, 0)">
          <rect width="120" height="36" rx="18" fill="#FFFFFF" stroke="rgba(15,23,42,0.1)"/>
          <text class="text-primary-light" font-size="14" x="60" y="23" text-anchor="middle">TypeScript</text>
        </g>
        <g class="pill-light" transform="translate(375, 0)">
          <rect width="90" height="36" rx="18" fill="#FFFFFF" stroke="rgba(15,23,42,0.1)"/>
          <text class="text-primary-light" font-size="14" x="45" y="23" text-anchor="middle">Docker</text>
        </g>
        <g class="pill-light" transform="translate(0, 50)">
          <rect width="90" height="36" rx="18" fill="#FFFFFF" stroke="rgba(15,23,42,0.1)"/>
          <text class="text-primary-light" font-size="14" x="45" y="23" text-anchor="middle">Python</text>
        </g>
        <g class="pill-light" transform="translate(105, 50)">
          <rect width="100" height="36" rx="18" fill="#FFFFFF" stroke="rgba(15,23,42,0.1)"/>
          <text class="text-primary-light" font-size="14" x="50" y="23" text-anchor="middle">Next.js</text>
        </g>
        <g class="pill-light" transform="translate(220, 50)">
          <rect width="110" height="36" rx="18" fill="#FFFFFF" stroke="rgba(15,23,42,0.1)"/>
          <text class="text-primary-light" font-size="14" x="55" y="23" text-anchor="middle">Postgres</text>
        </g>
      </g>
    </g>
  </g>
</svg>
