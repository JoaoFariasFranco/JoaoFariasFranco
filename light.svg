    </g>
  </g>

  <g transform="translate(465, 45)">
    <rect width="680" height="430" rx="12" fill="#f6f8fa" fill-opacity="0.75" stroke="rgba(31,35,40,0.12)" stroke-width="1.2"/>
    <path d="M0,12 Q0,0 12,0 L668,0 Q680,0 680,12 L680,38 L0,38 Z" fill="rgba(31,35,40,0.04)"/>
    <circle cx="22" cy="19" r="5" fill="#FF5F56"/>
    <circle cx="38" cy="19" r="5" fill="#FFBD2E"/>
    <circle cx="54" cy="19" r="5" fill="#27C93F"/>
    
    <text x="340" y="23" fill="#656c76" font-size="12" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-weight="normal" letter-spacing="0.5px">bash - profile.sh</text>

    <g transform="translate(35, 65)" font-family="Consolas, 'Courier New', monospace" font-weight="normal" letter-spacing="0.5px">
      
      <g clip-path="url(#clip-line1)">
        <text font-size="28" font-weight="700" fill="#1f2328" y="25" font-family="Consolas, 'Courier New', monospace" letter-spacing="0.5px">
          Hi, I'm <tspan fill="url(#accentGrad)">João Franco</tspan>
        </text>
      </g>

      <g clip-path="url(#clip-line2)">
        <text font-size="17" font-weight="600" fill="#475569" y="62" font-family="Consolas, 'Courier New', monospace" letter-spacing="0.5px">
          > Full Stack Developer &#38; UI Engineer
        </text>
      </g>

      <g clip-path="url(#clip-details)">
        <g transform="translate(0, 105)" font-size="14" font-family="Consolas, 'Courier New', monospace" letter-spacing="0.5px">
          <text font-weight="600" fill="#8250df" x="0" y="0">Subject:</text>
          <text font-weight="normal" fill="#1f2328" x="120" y="0">Full Stack</text>

          <text font-weight="600" fill="#8250df" x="0" y="28">Location:</text>
          <text font-weight="normal" fill="#1f2328" x="120" y="28">Brazil / Remote</text>

          <text font-weight="600" fill="#8250df" x="0" y="56">Education:</text>
          <text font-weight="normal" fill="#1f2328" x="120" y="56">Estacio</text>

          <text font-weight="600" fill="#8250df" x="0" y="84">Focus:</text>
          <text font-weight="normal" fill="#1f2328" x="120" y="84">High-performance &#38; Distributed Systems</text>

          <text font-weight="600" fill="#8250df" x="0" y="112">Contact:</text>
          <text font-weight="normal" fill="#475569" x="120" y="112">joao.franco.biz@gmail.com</text>
        </g>
      </g>

      <rect clip-path="url(#clip-details)" x="325" y="200" width="9" height="17" rx="1" fill="#0969da">
        <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
      </rect>

      <line x1="0" y1="250" x2="610" y2="250" stroke="rgba(31,35,40,0.12)" stroke-width="1" opacity="0">
        <animate attributeName="opacity" from="0" to="1" begin="1.5s" dur="0.8s" fill="freeze"/>
      </line>

      <g transform="translate(0, 275)" opacity="0">
        <animate attributeName="opacity" from="0" to="1" begin="2s" dur="0.8s" fill="freeze"/>
        <text font-size="15" font-weight="700" fill="#1f2328" y="0" font-family="Consolas, 'Courier New', monospace" letter-spacing="0.5px">Core Tech Stack</text>
        
        <g transform="translate(0, 16)">
          <g transform="translate(0,0)">
            <rect width="80" height="30" rx="15" fill="#ffffff" stroke="#0969da" stroke-width="1"/>
            <text font-size="12" fill="#0969da" x="40" y="19" text-anchor="middle" font-weight="600">SQL</text>
          </g>
          <g transform="translate(90,0)">
            <rect width="85" height="30" rx="15" fill="#ffffff" stroke="#8250df" stroke-width="1"/>
            <text font-size="12" fill="#8250df" x="42.5" y="19" text-anchor="middle" font-weight="600">Azure</text>
          </g>
          <g transform="translate(185,0)">
            <rect width="85" height="30" rx="15" fill="#ffffff" stroke="#1a7f37" stroke-width="1"/>
            <text font-size="12" fill="#1a7f37" x="42.5" y="19" text-anchor="middle" font-weight="600">Node.js</text>
          </g>
          <g transform="translate(280,0)">
            <rect width="105" height="30" rx="15" fill="#ffffff" stroke="#0969da" stroke-width="1"/>
            <text font-size="12" fill="#0969da" x="52.5" y="19" text-anchor="middle" font-weight="600">Microsoft</text>
          </g>
          <g transform="translate(395,0)">
            <rect width="85" height="30" rx="15" fill="#ffffff" stroke="rgba(31,35,40,0.2)" stroke-width="1"/>
            <text font-size="12" fill="#475569" x="42.5" y="19" text-anchor="middle" font-weight="600">Docker</text>
          </g>
          <g transform="translate(490,0)">
            <rect width="80" height="30" rx="15" fill="#ffffff" stroke="#8250df" stroke-width="1"/>
            <text font-size="12" fill="#8250df" x="40" y="19" text-anchor="middle" font-weight="600">Python</text>
          </g>
        </g>
      </g>

    </g>
