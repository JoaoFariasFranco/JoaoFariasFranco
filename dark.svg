        </g>
      </g>

      <rect class="cursor" x="300" y="215" width="9" height="17" rx="1" />

      <line x1="0" y1="250" x2="610" y2="250" stroke="rgba(255,255,255,0.08)" stroke-width="1" class="fade-in-delayed"/>

