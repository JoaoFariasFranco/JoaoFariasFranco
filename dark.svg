<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 610" width="1180" height="610">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.05" />
      <stop offset="50%" stop-color="#7C3AED" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#030712" stop-opacity="1" />
    </radialGradient>
    
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C3AED">
        <animate attributeName="stop-color" values="#7C3AED;#22D3EE;#10B981;#7C3AED" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#22D3EE">
        <animate attributeName="stop-color" values="#22D3EE;#10B981;#7C3AED;#22D3EE" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#10B981">
        <animate attributeName="stop-color" values="#10B981;#7C3AED;#22D3EE;#10B981" dur="8s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <filter id="glassShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="15" stdDeviation="25" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <style>
    .text-primary { font-family: system-ui, -apple-system, sans-serif; fill: #F8FAFC; }
    .text-muted { font-family: system-ui, -apple-system, sans-serif; fill: #94A3B8; }
    .text-code { font-family: 'Courier New', monospace; font-weight: bold; }
    
    /* Animação do Cursor */
    .cursor {
      animation: blink 1s step-end infinite;
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    /* Efeito de Hover nas Pílulas */
    .pill {
      transition: all 0.3s ease;
      cursor: pointer;
    }
    .pill:hover rect {
      stroke: #22D3EE;
      stroke-width: 2;
      filter: drop-shadow(0 0 8px rgba(34, 211, 238, 0.6));
    }
    .pill:hover text {
      fill: #22D3EE;
    }
  </style>

  <rect width="1180" height="610" fill="#030712" rx="16"/>
  <rect width="1180" height="610" fill="url(#bgGlow)" rx="16"/>

  <g transform="translate(60, 200)">
    <animateTransform attributeName="transform" type="translate" values="60,180; 60,195; 60,180" dur="6s" repeatCount="indefinite"/>
    
    <text class="text-code" fill="url(#accentGrad)" font-size="16" letter-spacing="2">
      <tspan x="0" dy="1.2em">      .--------.      </tspan>
      <tspan x="0" dy="1.2em">     / .------. \     </tspan>
      <tspan x="0" dy="1.2em">    / /        \ \    </tspan>
      <tspan x="0" dy="1.2em">    | |  {/}   | |    </tspan>
      <tspan x="0" dy="1.2em">    | |        | |    </tspan>
      <tspan x="0" dy="1.2em">    \ \        / /    </tspan>
      <tspan x="0" dy="1.2em">     \ '------' /     </tspan>
      <tspan x="0" dy="1.2em">      '--------'      </tspan>
      <tspan x="0" dy="1.2em">       _||__||_       </tspan>
    </text>
  </g>

  <g transform="translate(420, 50)" filter="url(#glassShadow)">
    <rect width="700" height="510" rx="16" fill="#0F172A" fill-opacity="0.8" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>
    
    <circle cx="30" cy="30" r="6" fill="#FF5F56"/>
    <circle cx="50" cy="30" r="6" fill="#FFBD2E"/>
    <circle cx="70" cy="30" r="6" fill="#27C93F"/>

    <g transform="translate(40, 90)">
      <text class="text-primary" font-size="36" font-weight="800">
        Hi, I'm {SEU_NOME_AQUI} <tspan class="cursor" fill="url(#accentGrad)">_</tspan>
      </text>

      <text class="text-muted" font-size="20" font-weight="500" y="45">
        > Full Stack Developer &amp; Open Source Contributor
      </text>

      <line x1="0" y1="80" x2="620" y2="80" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>

      <text class="text-muted" font-size="16" font-weight="400" y="115">
        <tspan x="0" dy="1.5em">📍 Location: Cyber Space</tspan>
        <tspan x="0" dy="1.5em">🎓 Focus: Building scalable web applications</tspan>
        <tspan x="0" dy="1.5em">📧 Contact: ola@seuemail.com</tspan>
      </text>

      <text class="text-primary" font-size="20" font-weight="700" y="220">
        Tecnologias &amp; Ferramentas
      </text>

      <g transform="translate(0, 240)">
        <g class="pill" transform="translate(0, 0)">
          <rect width="100" height="36" rx="18" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)"/>
          <text class="text-primary" font-size="14" x="50" y="23" text-anchor="middle">React</text>
        </g>
        <g class="pill" transform="translate(115, 0)">
          <rect width="110" height="36" rx="18" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)"/>
          <text class="text-primary" font-size="14" x="55" y="23" text-anchor="middle">Node.js</text>
        </g>
        <g class="pill" transform="translate(240, 0)">
          <rect width="120" height="36" rx="18" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)"/>
          <text class="text-primary" font-size="14" x="60" y="23" text-anchor="middle">TypeScript</text>
        </g>
        <g class="pill" transform="translate(375, 0)">
          <rect width="90" height="36" rx="18" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)"/>
          <text class="text-primary" font-size="14" x="45" y="23" text-anchor="middle">Docker</text>
        </g>
        
        <g class="pill" transform="translate(0, 50)">
          <rect width="90" height="36" rx="18" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)"/>
          <text class="text-primary" font-size="14" x="45" y="23" text-anchor="middle">Python</text>
        </g>
        <g class="pill" transform="translate(105, 50)">
          <rect width="100" height="36" rx="18" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)"/>
          <text class="text-primary" font-size="14" x="50" y="23" text-anchor="middle">Next.js</text>
        </g>
        <g class="pill" transform="translate(220, 50)">
          <rect width="110" height="36" rx="18" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)"/>
          <text class="text-primary" font-size="14" x="55" y="23" text-anchor="middle">Postgres</text>
        </g>
      </g>
    </g>
  </g>
</svg>
