<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 610" width="1180" height="610">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.15" />
      <stop offset="50%" stop-color="#22D3EE" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#030712" stop-opacity="1" />
    </radialGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C3AED">
        <animate attributeName="stop-color" values="#7C3AED;#22D3EE;#10B981;#7C3AED" dur="10s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#22D3EE">
        <animate attributeName="stop-color" values="#22D3EE;#10B981;#7C3AED;#22D3EE" dur="10s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#10B981">
        <animate attributeName="stop-color" values="#10B981;#7C3AED;#22D3EE;#10B981" dur="10s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <linearGradient id="scanlineLaser" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0" />
      <stop offset="30%" stop-color="#22D3EE" stop-opacity="0.9" />
      <stop offset="70%" stop-color="#7C3AED" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0" />
    </linearGradient>

    <filter id="noiseFilter">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" stitchTiles="stitch" />
      <feColorMatrix type="saturate" values="0" />
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.03" />
      </feComponentTransfer>
    </filter>

    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <clipPath id="clip-ascii-reveal">
      <rect x="-50" y="-20" width="500" height="0">
        <animate attributeName="height" from="0" to="520" dur="2s" begin="0.2s" fill="freeze" calcMode="spline" keySplines="0.25 0.1 0.25 1" />
      </rect>
    </clipPath>

    <clipPath id="clip-line1">
      <rect x="0" y="-10" width="0" height="60">
        <animate attributeName="width" from="0" to="650" dur="1s" begin="0.8s" fill="freeze" />
      </rect>
    </clipPath>

    <clipPath id="clip-line2">
      <rect x="0" y="40" width="0" height="50">
        <animate attributeName="width" from="0" to="650" dur="1.2s" begin="1.9s" fill="freeze" />
      </rect>
    </clipPath>

    <clipPath id="clip-details">
      <rect x="0" y="90" width="0" height="160">
        <animate attributeName="width" from="0" to="650" dur="1.8s" begin="3.2s" fill="freeze" />
      </rect>
    </clipPath>
  </defs>

  <style>
    .text-main { fill: #F8FAFC; }
    .text-muted { fill: #94A3B8; }
    .text-accent { fill: #22D3EE; }
    .text-purple { fill: #A78BFA; }
    
    .cursor { animation: blink 0.8s infinite; fill: #22D3EE; }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

    .fade-in-delayed {
      opacity: 0;
      animation: fadeIn 0.8s forwards 5.2s;
    }
    @keyframes fadeIn { to { opacity: 1; } }

    .pill { transition: transform 0.2s ease, filter 0.2s ease; cursor: pointer; }
    .pill:hover { transform: translateY(-2px) scale(1.03); filter: drop-shadow(0 0 8px rgba(34, 211, 238, 0.5)); }

    /* Estilo para a arte ASCII da esquerda */
    .ascii-text {
      font-family: ui-monospace, SFMono-Regular, Consolas, "Courier New", monospace;
      font-size: 8.5px;      
      white-space: pre;
      font-weight: bold;
    }
    
    /* Estilo para as informações da direita */
    .terminal-text {
      font-family: ui-monospace, SFMono-Regular, Consolas, "Courier New", monospace;
      font-size: 13px;       
      letter-spacing: 0.5px; 
      font-weight: normal;
    } 
  </style>

  <rect width="1180" height="610" rx="16" fill="#030712"/>
  <rect width="1180" height="610" rx="16" fill="url(#bgGlow)"/>
  <rect width="1180" height="610" rx="16" filter="url(#noiseFilter)" />
  <rect x="1.5" y="1.5" width="1177" height="607" rx="15" fill="none" stroke="url(#accentGrad)" stroke-width="1.5" opacity="0.4"/>

  <g fill="#22D3EE" opacity="0.35">
    <circle cx="120" cy="480" r="1.5"><animate attributeName="cy" values="480;120;480" dur="14s" repeatCount="indefinite"/></circle>
    <circle cx="380" cy="180" r="2"><animate attributeName="cy" values="180;520;180" dur="18s" repeatCount="indefinite"/></circle>
    <circle cx="850" cy="420" r="1.5"><animate attributeName="cy" values="420;80;420" dur="12s" repeatCount="indefinite"/></circle>
    <circle cx="1020" cy="220" r="2"><animate attributeName="cy" values="220;500;220" dur="16s" repeatCount="indefinite"/></circle>
  </g>

  <g transform="translate(35, 45)">
