  <g transform="translate(465, 45)">
    <rect width="680" height="520" rx="12" fill="#0F172A" fill-opacity="0.75" stroke="rgba(255,255,255,0.08)" stroke-width="1.2"/>
    <path d="M0,12 Q0,0 12,0 L668,0 Q680,0 680,12 L680,38 L0,38 Z" fill="rgba(255,255,255,0.03)"/>
    <circle cx="22" cy="19" r="5" fill="#FF5F56"/>
    <circle cx="38" cy="19" r="5" fill="#FFBD2E"/>
    <circle cx="54" cy="19" r="5" fill="#27C93F"/>
    
    <text class="terminal-text" x="340" y="23" fill="#64748B" font-size="12" text-anchor="middle">bash - profile.sh</text>

    <g transform="translate(35, 65)" class="terminal-text">
      
      <g clip-path="url(#clip-line1)">
        <text class="text-main" font-size="28" font-weight="700" y="25">
          Hi, I'm <tspan fill="url(#accentGrad)">João Franco</tspan>
        </text>
      </g>

      <g clip-path="url(#clip-line2)">
        <text class="text-accent" font-size="17" font-weight="600" y="62">
          &gt; Full Stack Developer &amp; UI Engineer
        </text>
      </g>

      <g clip-path="url(#clip-details)">
        <g transform="translate(0, 105)" font-size="14">
          <text class="text-purple" font-weight="600" x="0" y="0">Subject:</text>
          <text class="text-main" x="120" y="0">Full Stack Engineer</text>

          <text class="text-purple" font-weight="600" x="0" y="28">Location:</text>
          <text class="text-main" x="120" y="28">Brazil / Remote</text>

          <text class="text-purple" font-weight="600" x="0" y="56">Education:</text>
          <text class="text-main" x="120" y="56">B.S. in Computer Science</text>

          <text class="text-purple" font-weight="600" x="0" y="84">Focus:</text>
          <text class="text-main" x="120" y="84">High-performance Web &amp; Distributed Systems</text>

          <text class="text-purple" font-weight="600" x="0" y="112">Contact:</text>
