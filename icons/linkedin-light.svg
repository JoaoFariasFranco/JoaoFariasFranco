<svg xmlns="http://www.w3.org/2000/svg" viewBox="215 0 215 72" width="215" height="72" role="img">
  <title>LinkedIn</title>
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="100%">
      <stop offset="0%" stop-color="#0969da" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="1" />
    </radialGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8250df"><animate attributeName="stop-color" values="#8250df;#0969da;#1a7f3f;#8250df" dur="10s" repeatCount="indefinite" /></stop>
      <stop offset="50%" stop-color="#0969da"><animate attributeName="stop-color" values="#0969da;#1a7f3f;#8250df;#0969da" dur="10s" repeatCount="indefinite" /></stop>
      <stop offset="100%" stop-color="#1a7f3f"><animate attributeName="stop-color" values="#1a7f3f;#8250df;#0969da;#1a7f3f" dur="10s" repeatCount="indefinite" /></stop>
    </linearGradient>
    <filter id="noiseFilter">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" stitchTiles="stitch" />
      <feColorMatrix type="saturate" values="0" />
      <feComponentTransfer><feFuncA type="linear" slope="0.015" /></feComponentTransfer>
    </filter>
    <linearGradient id="scanlineLaser" x1="100%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0969da" stop-opacity="0" />
      <stop offset="30%" stop-color="#0969da" stop-opacity="0.25" />
      <stop offset="70%" stop-color="#8250df" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#8250df" stop-opacity="0" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
    <clipPath id="cardClip"><rect width="860" height="72" rx="12"/></clipPath>
  </defs>

  <rect width="860" height="72" rx="12" fill="#ffffff"/>
  <rect width="860" height="72" rx="12" fill="url(#bgGlow)"/>
  <rect width="860" height="72" rx="12" filter="url(#noiseFilter)" />
  <rect x="1.5" y="1.5" width="857" height="69" rx="11" fill="none" stroke="url(#accentGrad)" stroke-width="1.5" opacity="0.35"/>

  <rect x="22.5" y="16" width="170" height="40" rx="10" fill="#ffffff" stroke="#1a7f37" stroke-width="1"/>
