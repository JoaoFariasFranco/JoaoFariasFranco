  <rect x="237.5" y="16" width="170" height="40" rx="10" fill="#ffffff" stroke="#0969da" stroke-width="1"/>
  <path transform="translate(270.943, 20.214) scale(1.2143)" d="M12 11h2.5v1.5h.05c.35-.66 1.2-1.35 2.45-1.35 2.62 0 3.1 1.73 3.1 3.98V20H17.5v-4.37c0-1.04-.02-2.38-1.45-2.38-1.45 0-1.67 1.13-1.67 2.3V20H12V11zm-3-2a1.5 1.5 0 110-3 1.5 1.5 0 010 3zm-1.25 2h2.5V20h-2.5V11z" fill="#0969da"/>
  <text x="304.7" y="41.0" fill="#0969da" font-family="Consolas, 'Courier New', monospace" font-size="14" font-weight="600" textLength="61.6" lengthAdjust="spacingAndGlyphs">LinkedIn</text>
  <rect x="452.5" y="16" width="170" height="40" rx="10" fill="#ffffff" stroke="#8250df" stroke-width="1"/>
  <path transform="translate(488.65, 25.8) scale(0.85)" d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z" fill="#8250df"/>
  <text x="515.85" y="41.0" fill="#8250df" font-family="Consolas, 'Courier New', monospace" font-size="14" font-weight="600" textLength="69.3" lengthAdjust="spacingAndGlyphs">Portfólio</text>
  <rect x="667.5" y="16" width="170" height="40" rx="10" fill="#ffffff" stroke="#9a6700" stroke-width="1"/>
  <path transform="translate(714.6, 25.2) scale(0.9)" d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-8V6l8 5 8-5v2z" fill="#9a6700"/>
  <text x="742.4" y="41.0" fill="#9a6700" font-family="Consolas, 'Courier New', monospace" font-size="14" font-weight="600" textLength="46.2" lengthAdjust="spacingAndGlyphs">E-mail</text>

  <g clip-path="url(#cardClip)">
    <rect x="0" y="0" width="3" height="72" fill="url(#scanlineLaser)" filter="url(#neonGlow)">
      <animate attributeName="x" values="-10;870;-10" dur="8s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1; 0.4 0 0.2 1" />
    </rect>
  </g>
</svg>
